<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add User - HORA Bookshop</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="app-layout">

    {% include "partials/sidebar.html" %}

    <main class="main-content">

        <div class="top-header">

            <h1>Add User</h1>

            <div class="admin-info">
                <span>{{ current_user.username }}</span>
            </div>

        </div>


        <div class="dashboard-content">

            <div class="welcome">

                <h2>Create New User</h2>

                <p>
                    Add an administrator or sales personnel.
                </p>

            </div>


            <div class="form-container">

                <form
                    method="POST"
                    action="{{ url_for('add_user') }}"
                >

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="role">
                            Role
                        </label>

                        <select
                            id="role"
                            name="role"
                            required
                        >

                            <option value="">
                                Select Role
                            </option>

                            <option value="admin">
                                Administrator
                            </option>

                            <option value="sales">
                                Sales Personnel
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="btn"
                    >
                        Create User
                    </button>


                    <a
                        href="{{ url_for('users') }}"
                        class="btn"
                        style="margin-left: 5px;"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </main>

</div>

</body>

</html>
